# Bluetooth outputs run with a 1024-sample buffer (~21 ms at 48 kHz) instead
# of driving the whole graph at 256: under load a short buffer stutters.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        node.latency = "1024/48000"
      }
    }
  }
]
