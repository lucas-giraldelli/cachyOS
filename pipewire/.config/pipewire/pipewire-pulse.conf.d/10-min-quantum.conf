# Pulse clients (games under Wine/Proton, Discord) get at least a 1024-sample
# buffer (~21 ms at 48 kHz). With a Bluetooth headset driving the graph at 256,
# a game under load ran out of buffer (xruns) and the sound crackled.
pulse.properties = {
    pulse.min.req = 1024/48000
    pulse.min.frag = 1024/48000
    pulse.min.quantum = 1024/48000
}
